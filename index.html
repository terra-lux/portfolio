<style>
/* Layout: Behance-style gallery. Sticky top bar, project grid, case pages with stacked slides left and a sticky info panel right. */
:root{
  --bg:#ffffff; --surface:#ffffff; --fg:#1f1819; --body:#33333a; --muted:#5b5b60; --line:#ececee; --accent:#f5409e; --accent-ink:#ffffff; --chip:#f4f4f6; --line-strong:#d4d4da; --thumb-line:#e8e8e8;
  --f-display:"Poppins","Noto Sans KR",system-ui,sans-serif;
  --f-body:"Poppins","Noto Sans KR",system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  color-scheme:light;
}
:root[data-theme="dark"]{--bg:#0D121C;--surface:#111927;--fg:#F9FAFB;--body:#D2D6DB;--muted:#9DA4AE;--line:#1F2A37;--accent:#f5409e;--accent-ink:#0D121C;--chip:#1F2A37;--line-strong:#384250;--thumb-line:#1F2A37;color-scheme:dark}
*{box-sizing:border-box}
b,strong,h1,h2,h3,h4,th,dt,dd{font-weight:300}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:16px;font-weight:300;line-height:1.65;letter-spacing:-.01em;padding-inline:20px}
p,li{color:var(--body)}
a{color:inherit}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
::selection{background:color-mix(in srgb,var(--accent) 26%,var(--bg));color:var(--fg);-webkit-text-fill-color:var(--fg)}
:root[data-theme="dark"] ::selection{background:color-mix(in srgb,var(--accent) 42%,var(--bg));color:#fff;-webkit-text-fill-color:#fff}
.hero h1 em::selection{-webkit-text-fill-color:var(--fg)}
.wrap{max-width:1484px;margin-inline:auto}
/* top bar */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--bg) 72%,transparent);-webkit-backdrop-filter:saturate(180%) blur(16px);backdrop-filter:saturate(180%) blur(16px);border-bottom:1px solid var(--line);margin-inline:-20px;padding-inline:20px}
.bar{transition:box-shadow .3s ease,border-color .3s ease}
.pv .bar{box-shadow:none!important;transition:transform .35s cubic-bezier(.2,.7,.2,1),box-shadow .3s ease,border-color .3s ease}
.pv.bh .bar{transform:translateY(-101%)}
.bar.scrolled{box-shadow:0 6px 18px rgba(0,0,0,.08)}
.bar .wrap{display:flex;align-items:center;gap:20px;min-height:64px;flex-wrap:wrap;padding-block:0}
.brand{display:inline-flex;align-items:center;gap:8px;font-family:var(--f-display);font-weight:600;font-size:17px;text-decoration:none;letter-spacing:-.01em;margin-right:auto}
.brand span{color:var(--muted);font-weight:300;margin-left:-2px}
.brand .blg{flex:none}
.brand .blg{animation:blgs 1.8s cubic-bezier(.22,.8,.25,1) .2s backwards}
@keyframes blgs{from{transform:rotate(-360deg)}to{transform:rotate(0)}}
@media (prefers-reduced-motion:reduce){.brand .blg{animation:none}}
.nav{display:flex;gap:2px;align-items:center}
.nav a,.nav button{background:none;border:0;padding:9px 16px;border-radius:8px;text-decoration:none;cursor:pointer;font-size:15px;font-weight:300;line-height:1.5;letter-spacing:0;color:var(--muted)}
.nav a:hover,.nav button:hover,.nav a[aria-current="true"]{color:var(--fg);background:var(--chip)}
.nav a[aria-current="true"],.nav a[aria-current="true"]:hover{font-weight:300;background:var(--fg);color:var(--bg)}
/* hero */
.hero{margin-block:28px 36px;padding:0 56px;border-radius:20px;background:var(--surface);border:1px solid var(--line);position:relative;overflow:hidden;isolation:isolate;display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:32px;align-items:center}
.hero::before,.hero::after{content:"";position:absolute;z-index:-1;border-radius:50%;pointer-events:none;filter:blur(30px);will-change:transform}
.hero::before{width:62%;aspect-ratio:1;right:-14%;top:-48%;background:linear-gradient(90deg,#ff3f5f,#e53fff);-webkit-mask-image:radial-gradient(closest-side,#000,rgba(0,0,0,.35) 55%,transparent);mask-image:radial-gradient(closest-side,#000,rgba(0,0,0,.35) 55%,transparent);opacity:.14;animation:hgA 9s ease-in-out infinite alternate}
.hero::after{width:48%;aspect-ratio:1;left:-12%;bottom:-52%;background:linear-gradient(90deg,#ff3f5f,#e53fff);-webkit-mask-image:radial-gradient(closest-side,#000,rgba(0,0,0,.35) 55%,transparent);mask-image:radial-gradient(closest-side,#000,rgba(0,0,0,.35) 55%,transparent);opacity:.11;animation:hgB 12s ease-in-out infinite alternate}
@keyframes hgA{0%{transform:translate(0,0) scale(1)}35%{transform:translate(-55%,45%) scale(1.15)}70%{transform:translate(-120%,70%) scale(.95)}100%{transform:translate(-150%,20%) scale(1.1)}}
@keyframes hgB{0%{transform:translate(0,0) scale(1)}35%{transform:translate(70%,-45%) scale(1.15)}70%{transform:translate(150%,-70%) scale(.95)}100%{transform:translate(185%,-15%) scale(1.1)}}
@media (prefers-reduced-motion:reduce){.hero::before,.hero::after{animation:none}}
.hero .hl{display:grid;gap:28px;justify-items:start}
@keyframes hin{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
.hero.ent .eyebrow,.hero.ent h1,.hero.ent .meta .tag{animation:hin .7s cubic-bezier(.2,.7,.2,1) backwards}
.hero.ent .eyebrow{animation-delay:.15s}
.hero.ent h1{animation-delay:.3s}
.hero.ent .meta .tag:nth-child(1){animation-delay:.5s}
.hero.ent .meta .tag:nth-child(2){animation-delay:.6s}
.hero.ent .meta .tag:nth-child(3){animation-delay:.7s}
.hero.ent .meta .tag:nth-child(4){animation-delay:.8s}
@media (prefers-reduced-motion:reduce){.hero.ent .eyebrow,.hero.ent h1,.hero.ent .meta .tag{animation:none}}
.hv{--t:92px;--g:20px;position:relative;width:100%;max-width:520px;justify-self:end;height:440px;display:flex;justify-content:center;gap:var(--g);overflow:hidden;-webkit-mask-image:linear-gradient(to bottom,transparent,#000 18%,#000 82%,transparent);mask-image:linear-gradient(to bottom,transparent,#000 18%,#000 82%,transparent)}
.hv .vc{width:var(--t);flex:none}
.hv .vc:nth-child(2){margin-top:calc(var(--t)*.6)}
.hv .trk{display:flex;flex-direction:column;gap:var(--g);animation:hvs 104s linear infinite}
.hv .vc.rv .trk{animation-direction:reverse;animation-duration:120s}
@keyframes hvs{to{transform:translateY(calc(-50% - var(--g)/2))}}
@keyframes hvx{to{transform:translateX(calc(-50% - var(--g)/2))}}
.hv .tl{width:var(--t);height:var(--t);flex:none;border-radius:calc(var(--t)*.33);background:var(--surface);display:grid;place-items:center;box-shadow:0 10px 28px color-mix(in srgb,var(--accent) 11%,transparent),0 6px 18px color-mix(in srgb,var(--fg) 5%,transparent)}
.hv .tl svg{width:calc(var(--t)*.43);height:calc(var(--t)*.43);display:block}
:root[data-theme="dark"] .hv .lo,:root[data-theme="dark"] .skills .lo{filter:brightness(2.8) saturate(1.2)}
:root[data-theme="dark"] .hv .tl{background:rgba(6,9,15,.7);box-shadow:none}

@media (prefers-reduced-motion:reduce){.hv .trk{animation:none!important}}
.hero .eyebrow{display:inline-flex;align-items:center;gap:8px;font-size:14px;line-height:1.65;color:var(--muted);border:1px solid var(--thumb-line);background:color-mix(in srgb,var(--surface) 70%,transparent);border-radius:999px;padding:5px 14px}
.hero .eyebrow i{width:7px;height:7px;border-radius:50%;background:var(--accent);display:block;animation:hblink 1.6s ease-in-out infinite}
@keyframes hblink{0%,100%{opacity:1;box-shadow:0 0 0 0 color-mix(in srgb,var(--accent) 45%,transparent)}50%{opacity:.35;box-shadow:0 0 0 5px color-mix(in srgb,var(--accent) 0%,transparent)}}
@media (prefers-reduced-motion:reduce){.hero .eyebrow i{animation:none}}
.hero h1{font-family:var(--f-display);font-size:clamp(32px,5vw,60px);line-height:1.12;letter-spacing:-.035em;word-break:keep-all;margin:0}
.hero h1 em{font-style:normal;color:#ff3f5f;background:linear-gradient(90deg,#ff3f5f,#e53fff,#ff3f5f);background-size:200% 100%;-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;padding-right:.04em;animation:emFlow 4s linear infinite}
@keyframes emFlow{to{background-position:-200% 0}}
@media (prefers-reduced-motion:reduce){.hero h1 em{animation:none}}
.hero p{margin:0;color:var(--muted);font-size:18px;line-height:1.7;max-width:68ch}
.hero .tag{background:none;padding:0;border-radius:0;font-size:15px;line-height:1.65;color:#1f1819}
:root[data-theme="dark"] .hero .tag{color:var(--muted)}
.hero .tag{white-space:nowrap}
.hero .tag:not(:last-child)::after{content:"·";margin-left:10px;color:var(--line-strong)}
.hero .meta{display:flex;gap:4px 10px;flex-wrap:wrap}
.hero .cta{display:flex;gap:10px;flex-wrap:wrap;margin-top:4px}
.hero .btn{display:inline-flex;align-items:center;gap:8px;padding:13px 24px;border-radius:999px;font-size:16px;line-height:1.4;text-decoration:none;cursor:pointer;border:1px solid var(--fg);transition:border-color .4s ease,background-color .3s ease,transform .3s ease}
.hero .btn.pri{background:var(--fg);color:var(--bg)}
.hero .btn.pri:hover{background:var(--accent);border-color:var(--accent);transform:translateY(-2px)}
.hero .btn.sec{background:transparent;color:var(--fg);border-color:var(--line-strong)}
.hero .btn.sec:hover{border-color:var(--fg)}
.tag{display:inline-block;font-size:13px;font-weight:300;line-height:1.65;padding:3px 10px;border-radius:999px;background:var(--chip);color:var(--fg)}
/* filter */
.tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center;padding-block:14px 22px}
.tools .lab{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-right:6px}
.f{border:1px solid var(--line);background:var(--surface);padding:10px 20px;border-radius:999px;cursor:pointer;font-size:16px;font-weight:300;transition:background-color .3s ease,transform .3s ease,box-shadow .3s ease}
:root[data-theme="dark"] .f{background:#1F2A37;border-color:#384250}
:root[data-theme="dark"] .f:hover{background:#384250}
:root[data-theme="dark"] .f[aria-pressed="true"],:root[data-theme="dark"] .f[aria-pressed="true"]:hover{background:var(--fg);border-color:var(--fg)}
.f:hover{background:var(--chip);transform:translateY(-2px);box-shadow:0 4px 10px rgba(0,0,0,.08)}
.f[aria-pressed="true"]:hover{background:var(--fg);box-shadow:0 4px 10px rgba(0,0,0,.2)}
.f[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg);font-weight:600}
.f{display:inline-flex;flex-direction:column;align-items:center}
.f::after{content:attr(data-l);font-weight:600;height:0;overflow:hidden;visibility:hidden;pointer-events:none}
/* grid */
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:28px 22px;padding-bottom:60px}
.card{display:block;text-decoration:none;min-width:0;border:1px solid var(--thumb-line);border-radius:12px;overflow:hidden;background:var(--surface);transition:border-color .4s ease,box-shadow .4s ease,transform .4s ease}
.card:hover{border-color:var(--fg);transform:translateY(-6px);box-shadow:0 12px 28px rgba(0,0,0,.12)}
:root[data-theme="dark"] .card{background:rgba(31,42,55,.5);border-color:#384250}
:root[data-theme="dark"] .card:hover{border-color:#6C737F}
@media (prefers-reduced-motion:reduce){.card:hover{transform:none}}
.card .tx{padding:20px}
.card .cv{position:relative;aspect-ratio:16/10;overflow:hidden;background:var(--chip)}
.card .cv img{width:100%;height:100%;object-fit:cover;object-position:left top;display:block;transition:transform .5s ease}
.card:hover .cv img{transform:scale(1.035)}
.card .yr{position:absolute;left:10px;top:10px;background:var(--surface);color:var(--fg);font:600 12px/1.65 var(--f-display);padding:1px 10px;border-radius:999px}
.card h3{font-size:16.5px;font-weight:300;line-height:1.65;letter-spacing:-.01em;color:var(--fg);margin:0 0 4px;word-break:keep-all}
.card p{margin:0;color:var(--muted);font-size:14px;font-weight:300;line-height:1.65}
.card .pd{display:block;margin-top:10px;font-size:13px;line-height:1.65;color:var(--muted);font-variant-numeric:tabular-nums}
.card .st{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.card .st b{font-family:var(--f-display);font-weight:300;font-size:13px;color:var(--accent)}
.card .st span{font-size:13px;line-height:1.65;color:var(--muted)}
/* about */
.about{display:grid;grid-template-columns:minmax(0,1fr);gap:48px;padding-block:60px;border-top:1px solid var(--line)}
.about h2,.contact h2{font-family:var(--f-display);font-weight:300;font-size:20px;line-height:1.25;letter-spacing:-.01em;word-break:keep-all;margin:0 0 16px}
.about>div{display:grid;gap:24px;width:100%}
.about h2{margin:0}
.about p{color:var(--muted);font-weight:300;margin:0;max-width:none;width:100%}
.career{list-style:none;margin:0;padding:0;display:grid}
.career li{display:grid;grid-template-columns:112px minmax(0,1fr);gap:14px;padding:13px 0;border-bottom:1px solid var(--line)}
.career .y{font:500 13px var(--f-display);color:var(--muted);font-variant-numeric:tabular-nums}
.career strong{display:block;font-size:16px;font-weight:300}
.career small{color:var(--muted);font-size:13px;line-height:1.65;display:block}
.skills{display:flex;gap:8px;flex-wrap:wrap}
.skills .tag{display:inline-flex;align-items:center;gap:8px;padding:8px 16px;font-size:15px}
.skills .tag svg{flex:none;color:var(--accent);width:16px;height:16px}
.skills .tag svg+svg{margin-left:-2px}
:root[data-theme="dark"] .skills .tag{background:#1F2A37;color:#D2D6DB;border-color:#1F2A37}
.sec-lb{margin:0;font-size:13px;font-weight:300;letter-spacing:.02em;text-transform:uppercase;color:var(--muted);line-height:1.65}
.sg{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,380px),1fr));gap:16px}
.sc{border:1px solid var(--thumb-line);border-radius:12px;background:var(--surface);padding:20px;display:flex;flex-direction:column;gap:8px;min-width:0;transition:border-color .45s ease}
.sc:hover{border-color:color-mix(in srgb,var(--accent) 40%,var(--thumb-line))}
.sc .ic{display:inline-flex;align-items:center;justify-content:center;width:40px;height:40px;border-radius:10px;background:color-mix(in srgb,var(--accent) 6%,transparent);color:var(--accent);margin-bottom:4px}
:root[data-theme="dark"] .sc .ic{background:color-mix(in srgb,var(--accent) 18%,transparent);color:#ff7db9}
:root[data-theme="dark"] .sc .ic svg{stroke-width:2.1}
.sc h3{margin:0;font-size:16.5px;font-weight:300;line-height:1.65;letter-spacing:-.01em;color:var(--fg);word-break:keep-all}
.about .sc p{font-size:14px;margin:0}
.sc .ev{margin-top:auto;padding-top:4px;font-size:13px;font-weight:500;color:var(--accent);line-height:1.65}
.nm{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px}
.nm>div{display:grid;gap:4px;align-content:start;padding-block:4px}
.nm b{font-family:var(--f-display);font-size:28px;font-weight:500;line-height:1.25;letter-spacing:-.02em;color:var(--fg)}
.nm span{font-size:13px;line-height:1.65;color:var(--muted)}
.ps{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px;counter-reset:ps}
.ps li{border-top:1px solid var(--line-strong);padding-top:14px;display:grid;gap:6px;align-content:start;counter-increment:ps}
.ps li::before{content:"0" counter(ps);font:500 13px var(--f-display);color:var(--accent)}
.ps strong{font-size:16px;font-weight:300;color:var(--fg)}
.ps p{font-size:14px;margin:0}
/* contact */
.contact{padding-block:60px;border-top:1px solid var(--line)}
.contact .rows{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px;margin-top:20px}
.crow{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px;min-width:0}
.crow small{display:block;color:var(--muted);font-size:13px;font-weight:300;letter-spacing:.02em;text-transform:uppercase}
.crow .v{display:flex;gap:10px;align-items:center;justify-content:space-between;margin-top:2px}
.crow .v span,.crow .v a{overflow-wrap:anywhere;font-weight:300;font-size:14px}
.crow{position:relative}
@property --ca{syntax:"<angle>";inherits:false;initial-value:0deg}
.crow.sw::after{content:"";position:absolute;inset:-1px;border-radius:10px;padding:2px;pointer-events:none;background:conic-gradient(from var(--ca),transparent 0deg,transparent 215deg,rgba(245,64,158,.25) 260deg,#fa8bc1 315deg,#f5409e 352deg,transparent 360deg);-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask:linear-gradient(#000 0 0) content-box exclude,linear-gradient(#000 0 0);animation:csw 1.2s cubic-bezier(.45,.05,.25,1) forwards}
@keyframes csw{0%{--ca:0deg;opacity:1}88%{opacity:1}100%{--ca:360deg;opacity:0}}
@media (prefers-reduced-motion:reduce){.crow.sw::after{animation:none;opacity:0}}
.cp{border:1px solid var(--line);background:var(--bg);border-radius:999px;font-size:12px;padding:3px 10px;cursor:pointer;flex:none;transition:border-color .4s ease}
.cp:hover{border-color:var(--fg)}
/* case */
.back{display:inline-flex;gap:6px;align-items:center;margin-block:22px 14px;color:var(--fg);background:var(--surface);border:1px solid var(--line);padding:6px 14px;border-radius:999px;text-decoration:none;font-size:14px;font-weight:300;transition:border-color .4s ease}
.back:hover{border-color:var(--fg)}
.case{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:32px;align-items:start;padding-bottom:50px}
.stack{display:grid;gap:14px;min-width:0}
.stack figure{margin:0}
.stack img{display:block;width:100%;height:auto;aspect-ratio:16/9;background:var(--surface)}
.stack figcaption{font-size:12px;color:var(--muted);padding:5px 2px 0}
.panel{position:sticky;top:calc(76px + env(safe-area-inset-top,0px));background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:22px;min-width:0}
.panel .k{font:700 13px/1.65 var(--f-display);letter-spacing:.02em;text-transform:uppercase;color:var(--accent);margin:0 0 6px}
.panel h1{font-size:23px;line-height:1.3;margin:0 0 6px;letter-spacing:-.02em;text-wrap:balance}
.panel .sub{color:var(--muted);font-size:14px;line-height:1.65;margin:0 0 16px}
.dl{display:grid;grid-template-columns:78px minmax(0,1fr);gap:7px 12px;margin:0 0 16px;font-size:14px;line-height:1.65}
.dl dt{color:var(--muted)}
.dl dd{margin:0;font-weight:300;color:var(--fg)}
.blk{border-top:1px solid var(--line);padding-top:14px;margin-top:14px}
.blk h4{margin:0 0 4px;font-size:13px;color:var(--muted);font-weight:300;letter-spacing:.02em}
.blk p,.blk li{margin:0;font-size:14px}
.blk ul{margin:0;padding-left:18px;display:grid;gap:3px}
.nums{display:grid;gap:8px;margin-top:2px}
.nums div{display:flex;gap:10px;align-items:baseline}
.nums b{font:700 21px var(--f-display);letter-spacing:-.02em;color:var(--accent);font-variant-numeric:tabular-nums;white-space:nowrap}
.nums span{font-size:13px;line-height:1.65;color:var(--muted)}
.ext:hover{border-color:var(--fg)}
.ext{display:inline-block;margin-top:14px;background:var(--accent);color:var(--accent-ink);border:1px solid transparent;transition:border-color .4s ease;padding:8px 15px;border-radius:999px;text-decoration:none;font-weight:300;font-size:15px}
.note{font-size:13px;color:var(--muted);margin-top:10px}
.next{border-top:1px solid var(--line);padding-block:32px 70px}
.next .grid{padding-bottom:0;grid-template-columns:repeat(3,minmax(0,1fr))}
.next h2{font-family:var(--f-display);font-weight:300;font-size:20px;line-height:1.25;letter-spacing:-.01em;word-break:keep-all;margin:0 0 16px}
footer{border-top:1px solid var(--line);padding-block:60px 36px;color:var(--muted);font-size:13px;line-height:1.65}
/* case: Behance-style detail */
.pj{padding-block:8px 20px}
.pj-head{display:grid;gap:16px;padding-block:18px 26px;max-width:980px}
.pj-head h1{font-family:var(--f-display);font-weight:300;font-size:clamp(24px,5vw,32px);line-height:1.25;letter-spacing:-.02em;word-break:keep-all;margin:0}
.owner{display:flex;gap:12px;align-items:center}
.av{width:42px;height:42px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font:700 14px var(--f-display);flex:none}
.owner b{display:block;font-size:15px;font-weight:300;line-height:1.65}
.owner small{color:var(--muted);font-size:13px;line-height:1.65}
.pj-body{display:grid;grid-template-columns:minmax(0,1fr) 64px;gap:20px;align-items:start}
.mods{min-width:0;max-width:1400px;margin-inline:auto;width:100%;overflow:hidden;background:var(--surface)}
.mods img{display:block;width:100%;height:auto;aspect-ratio:16/9}
.fab{position:sticky;top:calc(84px + env(safe-area-inset-top,0px));display:grid;gap:12px;justify-items:center}
.fab button{width:48px;height:48px;border-radius:50%;border:1px solid var(--line);background:var(--surface);cursor:pointer;display:grid;place-items:center;font-size:11px;line-height:1.1;padding:0;text-align:center}
.fab button{transition:border-color .4s ease}
.fab button svg{display:block}
.fab button:hover{border-color:var(--fg)}
.fab .av{width:48px;height:48px;text-decoration:none;cursor:pointer;transition:transform .3s ease,box-shadow .3s ease}
.fab .av:hover{transform:scale(1.08);box-shadow:0 6px 16px color-mix(in srgb,var(--accent) 35%,transparent)}
.desc{max-width:1400px;margin:34px auto 0;display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:40px}
.desc h2{font-size:13px;letter-spacing:.02em;text-transform:uppercase;color:var(--muted);margin:0 0 10px;font-weight:300;line-height:1.65}
.desc p{margin:0 0 14px;max-width:62ch;font-size:16px;line-height:1.65}
.desc ul{margin:0 0 14px;padding-left:18px;display:grid;gap:10px;font-size:16px}
.desc li{line-height:1.7}
.pinfo{border-left:1px solid var(--line);padding-left:28px;min-width:0}
.pinfo .nums{margin-bottom:18px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.more{border-top:1px solid var(--line);margin-top:44px;padding-block:32px 70px}
.more h2{font-family:var(--f-display);font-weight:300;font-size:20px;line-height:1.25;letter-spacing:-.01em;word-break:keep-all;margin:0 0 16px}
.more .grid{padding-bottom:0}
@media (max-width:980px){
  .pj-body{grid-template-columns:minmax(0,1fr)}
  .fab{position:fixed;top:auto;bottom:0;left:0;right:0;display:flex;justify-content:center;gap:14px;padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px));background:var(--bg);border-top:1px solid var(--line);z-index:15}
  .fab button,.fab .av{width:42px;height:42px}
  .desc{grid-template-columns:minmax(0,1fr)}
  .pinfo{border-left:0;padding-left:0;border-top:1px solid var(--line);padding-top:18px}
  .more{margin-bottom:60px}
}
/* lightbox */
.lb{position:fixed;inset:0;background:rgba(10,9,14,.92);z-index:50;display:flex;align-items:center;justify-content:center;padding:20px;cursor:zoom-out}
.lb img{max-width:100%;max-height:100%;border-radius:6px}
@media (max-width:1240px){
  .hero{padding:0 40px;gap:24px}
  .hv{--t:76px;--g:16px;height:400px}
}
@media (max-width:980px){
  .grid,.next .grid{grid-template-columns:repeat(2,minmax(0,1fr))}
  .about{grid-template-columns:minmax(0,1fr)}
  .hero{grid-template-columns:minmax(0,1fr);padding:44px 32px 20px;gap:20px}
  .hv{--t:68px;--g:14px;max-width:none;justify-self:stretch;height:auto;flex-direction:column;justify-content:flex-start;padding-block:16px;margin-block:-16px;margin-inline:-32px;width:auto;-webkit-mask-image:linear-gradient(to right,transparent,#000 7%,#000 93%,transparent);mask-image:linear-gradient(to right,transparent,#000 7%,#000 93%,transparent)}
  .hv .vc{width:100%}
  .hv .vc:nth-child(2){margin-top:0}
  .hv .vc:nth-child(2) .trk{margin-left:calc(var(--t)*-.5)}
  .hv .trk{flex-direction:row;width:max-content;animation-name:hvx;animation-duration:48s}
  .hv .vc.rv .trk{animation-direction:reverse;animation-duration:56s}
  .case{grid-template-columns:minmax(0,1fr)}
  .panel{position:static;order:-1}
}
@media (max-width:620px){
  .grid,.next .grid{grid-template-columns:minmax(0,1fr)}
  .hero{padding:32px 20px 24px;border-radius:16px;gap:20px}
  .bar .wrap{padding-block:12px;gap:8px 20px;min-height:0}
  .hv{--t:56px;--g:12px;margin-inline:-20px}
  .career li{grid-template-columns:minmax(0,1fr);gap:2px}
  .brand span{display:none}
  .nav{gap:2px}
  .nav a,.nav button{padding:8px 10px;font-size:14px;line-height:1.4;letter-spacing:0;white-space:nowrap}
  .hero .tag:not(:last-child)::after{display:none}
  .hero .meta{gap:2px 16px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
*,*::before,*::after{word-break:keep-all}
body{overflow-wrap:break-word}
/* titles bold */
h1,h2,h3,h4,.hero h1,.pj-head h1,.card h3,.sc h3,.ps strong,.career strong,.sec-lb,.desc h2,.blk h4{font-weight:600!important}

/* lang + theme controls */
.nav .tb{padding:0;display:inline-flex;align-items:center;justify-content:center;width:40.5px;height:40.5px;border-radius:8px}
.nav .tb svg{display:block}
.lg{position:relative}
.nav .lgb{display:inline-flex;align-items:center;gap:5px;padding:0 12px;height:40.5px;border-radius:8px}
.nav .lgb .chv{transition:transform .25s ease}
.nav .lgb[aria-expanded="true"] .chv{transform:rotate(180deg)}
.lgm{position:absolute;right:0;top:calc(100% + 4px);margin:0;padding:6px;display:flex;flex-direction:column;gap:2px;list-style:none;min-width:140px;background:var(--surface);border:1px solid var(--line-strong);border-radius:14px;box-shadow:0 12px 32px rgba(0,0,0,.14);z-index:60}
.lgm[hidden]{display:none}
.nav .lgb #lgl{font-size:14px;letter-spacing:0}
.nav .lgb{gap:5px}
.lgm li{padding:8px 12px;border-radius:6px;cursor:pointer;font-size:14px;font-weight:300;color:var(--body);transition:background-color .2s ease}
.lgm li:hover{background:var(--chip)}
.lgm li[aria-selected="true"]{color:var(--accent);font-weight:600}
@media (max-width:620px){.nav .lgb{padding:0 8px;height:35.6px}.nav .tb{width:35.6px;height:35.6px}}

/* theme switch animation */
::view-transition-old(root),::view-transition-new(root){animation:none;mix-blend-mode:normal}
::view-transition-old(root){z-index:1}
::view-transition-new(root){z-index:2}
:root.tm *,:root.tm *::before,:root.tm *::after{transition:background-color .4s ease,color .4s ease,border-color .4s ease,fill .4s ease,box-shadow .4s ease!important}

/* scroll reveal */
.scr{opacity:0;transform:translateY(32px);transition:opacity .7s ease,transform .7s cubic-bezier(.2,.7,.2,1)}
.scr.in{opacity:1;transform:none}

.pj-wrap{display:grid;grid-template-columns:minmax(0,1fr) 64px;gap:0 20px;align-items:start}
.pj-wrap .pj-body{display:contents}
.pj-wrap .mods{grid-column:1;grid-row:1}
.pj-wrap .fab{grid-column:2;grid-row:1 / span 3}
.pj-wrap .more{grid-column:1;grid-row:3;width:100%;max-width:1400px;margin-inline:auto;margin-top:44px}
.pj-wrap .desc{grid-column:1;grid-row:2;width:100%}
@media (max-width:980px){html.pv footer{margin-bottom:84px}.pj-wrap{grid-template-columns:minmax(0,1fr)}.pj-wrap .fab{grid-column:auto;grid-row:auto}.pj-wrap .mods,.pj-wrap .desc,.pj-wrap .more{grid-column:1}}
